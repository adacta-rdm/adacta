name: CI

on:
  push:
    # Only branches without a slash. Build artifact branches are skipped.
    branches: "*"
  pull_request:

jobs:
  check:
    name: Check types, run tests, lint, and check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Run Oxlint
        run: bun run lint

      - name: Check formatting with Oxfmt
        run: bun run format:check
