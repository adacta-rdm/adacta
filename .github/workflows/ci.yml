name: CI

on:
  push:
    # Only branches without a slash. Build artifact branches are skipped.
    branches: "*"
  pull_request:

jobs:
  check:
    name: Check types, run tests, lint, and check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Run Oxlint
        run: bun run lint

      - name: Check formatting with Oxfmt
        run: bun run format:check

  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      # The test command starts a production build with its own seeded databases.
      - name: Run browser journeys
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
